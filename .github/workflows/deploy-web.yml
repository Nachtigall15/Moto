name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - claude/motorcycle-app-mvp-IclPm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # base-href = exakter Repo-Name (GitHub-Pages-Pfad ist
      # case-sensitive!). github.event.repository.name liefert die
      # korrekte Schreibweise automatisch -> /Moto/.
      # Routing läuft keyless über BRouter; nur TomTom-Verkehr braucht
      # noch einen Key (optional, Secret darf leer sein).
      - name: Build web
        run: >
          flutter build web --release --no-tree-shake-icons
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=TOMTOM_API_KEY=${{ secrets.TOMTOM_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
