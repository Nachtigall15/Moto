name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - claude/motorcycle-app-mvp-IclPm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Keys kommen aus GitHub-Secrets (Repo > Settings > Secrets and
      # variables > Actions). Sie landen im JS-Bundle (clientseitig
      # ohnehin sichtbar) – Keys daher per Domain/Referrer einschränken.
      - name: Build web
        run: >
          flutter build web --release --no-tree-shake-icons
          --base-href "/moto/"
          --dart-define=GRAPHHOPPER_API_KEY=${{ secrets.GRAPHHOPPER_API_KEY }}
          --dart-define=TOMTOM_API_KEY=${{ secrets.TOMTOM_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
